<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shiba Lab. IDP Report（PDF生成ツール）</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    :root {
        --primary-color: #1a365d;
        --accent-color: #d69e2e;
        --text-main: #2d3748;
        --border-color: #e2e8f0;
    }
    body {
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
        background-color: #e2e8f0;
        color: var(--text-main);
        padding: 10px;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #report-container {
        width: 100%;
        max-width: 800px;
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        margin-bottom: 20px;
        position: relative;
        box-sizing: border-box;
    }
    .header {
        text-align: center;
        border-bottom: 2px solid var(--primary-color);
        padding-bottom: 15px;
        margin-bottom: 15px;
    }
    .header h1 {
        color: var(--primary-color);
        font-size: 20px;
        margin: 0 0 10px 0;
        letter-spacing: 1px;
    }

    /* 選手名・年月入力セクション */
    .player-meta {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 20px;
        align-items: center;
    }
    .name-group {
        font-size: 18px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .name-group input {
        font-size: 18px;
        padding: 5px 10px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        text-align: center;
        width: 160px;
    }
    .date-group {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 16px;
    }
    .date-group select {
        padding: 5px 10px;
        font-size: 16px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: #fff;
    }

    /* 総括コメント欄 */
    .summary-section {
        margin-bottom: 25px;
    }
    .summary-section label {
        display: block;
        font-size: 14px;
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 5px;
    }
    .summary-box {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 14px;
        line-height: 1.6;
        min-height: 100px;
        box-sizing: border-box;
        background-color: #fffaf0;
    }

    .video-link-section {
        background: #ebf8ff;
        border: 1px dashed #63b3ed;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
    }
    .video-link-section input {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }
    
    .video-access-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        background: #f7fafc;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        margin-bottom: 25px;
        text-align: center;
    }
    #qrcode {
        width: 80px;
        height: 80px;
        background: #fff;
        padding: 5px;
        border: 1px solid #cbd5e0;
    }

    .content-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        align-items: start;
    }
    .chart-box {
        position: relative;
        height: 300px;
        width: 100%;
    }
    .axis-item {
        background: #f8fafc;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
    }
    .axis-header {
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 10px;
        font-size: 14px;
        border-bottom: 1px dashed #cbd5e0;
        padding-bottom: 5px;
    }
    .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 5px;
        font-size: 12px;
    }
    .slider-row input[type=range] { flex: 1; accent-color: var(--accent-color); }
    .score-val { font-weight: bold; width: 20px; text-align: right; }
    .comment-box {
        width: 100%;
        margin-top: 10px;
        padding: 8px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        font-size: 13px;
        line-height: 1.5;
        min-height: 50px;
        box-sizing: border-box;
    }

    .export-btn {
        width: 100%;
        max-width: 800px;
        padding: 15px;
        background-color: #c53030;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        margin-bottom: 40px;
    }
