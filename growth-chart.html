<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDP 成長可視化レポート（PDF生成ツール）</title>

<!-- 必要なライブラリ（グラフ、画像化、PDF化、QRコード） -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    :root {
        --primary-color: #1a365d;
        --accent-color: #d69e2e;
        --text-main: #2d3748;
        --border-color: #e2e8f0;
    }
    body {
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
        background-color: #e2e8f0;
        color: var(--text-main);
        padding: 20px;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    /* レポート本体の枠 */
    #report-container {
        width: 100%;
        max-width: 800px;
        background: #ffffff;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        margin-bottom: 20px;
        position: relative;
    }
    .header {
        text-align: center;
        border-bottom: 2px solid var(--primary-color);
        padding-bottom: 15px;
        margin-bottom: 25px;
    }
    .header h1 {
        color: var(--primary-color);
        font-size: 24px;
        margin: 0 0 10px 0;
        letter-spacing: 2px;
    }
    .player-inputs {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
    }
    .player-inputs input {
        font-size: 16px;
        padding: 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        text-align: center;
        font-weight: bold;
    }
    
    /* 動画リンク入力セクション */
    .video-link-section {
        background: #ebf8ff;
        border: 1px dashed #63b3ed;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 25px;
        text-align: center;
    }
    .video-link-section input {
        width: 80%;
        padding: 10px;
        font-size: 14px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        margin-bottom: 15px;
    }
    
    /* レポート上に表示される動画アクセスエリア */
    .video-access-area {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f7fafc;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        margin-bottom: 25px;
    }
    #qrcode {
        width: 80px;
        height: 80px;
        background: #fff;
        padding: 5px;
        border: 1px solid #cbd5e0;
    }
    .video-text {
        text-align: left;
    }
    .video-text h3 {
        margin: 0 0 5px 0;
        color: var(--primary-color);
        font-size: 16px;
    }
    .video-text p {
        margin: 0;
        font-size: 12px;
        color: #718096;
    }

    /* グラフとコメントレイアウト */
    .content-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        align-items: start;
    }
    .chart-box {
        position: relative;
        height: 350px;
        width: 100%;
    }
    .axis-item {
        background: #f8fafc;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
    }
    .axis-header {
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 10px;
        font-size: 14px;
        border-bottom: 1px dashed #cbd5e0;
        padding-bottom: 5px;
    }
    .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 5px;
        font-size: 12px;
    }
    .slider-row input[type=range] {
        flex: 1;
        accent-color: var(--accent-color);
    }
    .comment-box {
        width: 100%;
        margin-top: 10px;
        padding: 8px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        font-size: 13px;
        line-height: 1.5;
        resize: vertical;
        min-height: 50px;
        box-sizing: border-box;
    }

    .export-btn {
        width: 100%;
        max-width: 800px;
        padding: 15px;
        background-color: #c53030;
        color: white;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: background-color 0.2s;
    }
    .export-btn:hover {
        background-color: #9b2c2c;
    }

    /* エクスポート（PDF化）時のみ適用されるスタイル */
    .exporting .hide-on-export { display: none !important; }
    .exporting input, .exporting textarea {
        border: none !important;
        background: transparent !important;
        resize: none !important;
        padding: 0 !important;
    }
    .exporting .axis-item {
        border: none;
        background: transparent;
        padding: 0 0 10px 0;
        border-bottom: 1px solid var(--border-color);
        border-radius: 0;
    }
</style>
</head>
<body>

<div id="report-container">
    
    <div class="header">
        <h1>IDP PERFORMANCE REPORT</h1>
        <div class="player-inputs">
            <input type="text" id="playerName" value="山田 太郎 選手">
            <input type="text" id="reportMonth" value="2026年5月度">
        </div>
    </div>

    <!-- ツール操作用の動画URL入力枠（エクスポート時は消えます） -->
    <div class="video-link-section hide-on-export">
        <label style="font-weight: bold; display: block; margin-bottom: 8px; color: #2b6cb0;">🔗 共有する動画のURLを入力してください</label>
        <input type="url" id="videoUrlInput" placeholder="例: https://youtu.be/xxxxx または Googleドライブのリンク" oninput="generateQR()">
        <p style="font-size: 11px; margin:0;">※入力すると、レポート上にQRコードが自動生成されます。</p>
    </div>

    <!-- レポートに印字される動画アクセス枠 -->
    <div class="video-access-area" id="videoAccessArea" style="display: none;">
        <div id="qrcode"></div>
        <div class="video-text">
            <h3>▶ 解説動画はこちらから</h3>
            <p>※スマホでPDFをご覧の方は、下のボタン（またはこのエリア）をタップしてください。<br>※紙でご覧の方は左のQRコードを読み取ってください。</p>
        </div>
    </div>

    <div class="content-grid">
        <div class="chart-box">
            <canvas id="radarChart"></canvas>
        </div>
        <div id="axes-container">
            <!-- JSで動的に生成 -->
        </div>
    </div>

</div>

<!-- PDF保存ボタン -->
<button class="export-btn" onclick="exportToPDF()">📄 PDFファイルとして保存（動画リンク付き）</button>

<script>
    const axesData = [
        { id: 'tech', name: '技術・身体操作', before: 3, after: 7 },
        { id: 'tactics', name: '状況判断・戦術理解', before: 4, after: 6 },
        { id: 'mental', name: 'メンタル・自信', before: 3, after: 8 },
        { id: 'physical', name: 'フィジカル・運動量', before: 5, after: 6 },
        { id: 'independence', name: '言語化・主体性', before: 2, after: 7 }
    ];

    let chartInstance = null;
    let qrCodeInstance = null;

    // UI生成
    function buildUI() {
        const container = document.getElementById('axes-container');
        axesData.forEach((axis, index) => {
            const div = document.createElement('div');
            div.className = 'axis-item';
            div.innerHTML = `
                <div class="axis-header">${axis.name}</div>
                <div class="hide-on-export">
                    <div class="slider-row">
                        <span style="width:40px;">入会時</span>
                        <input type="range" min="1" max="10" value="${axis.before}" oninput="updateData(${index}, 'before', this.value)">
                        <span class="score-val" id="before-val-${index}">${axis.before}</span>
                    </div>
                    <div class="slider-row" style="color:var(--accent-color);">
                        <span style="width:40px; font-weight:bold;">現在</span>
                        <input type="range" min="1" max="10" value="${axis.after}" oninput="updateData(${index}, 'after', this.value)">
                        <span class="score-val" id="after-val-${index}">${axis.after}</span>
                    </div>
                </div>
                <textarea class="comment-box" placeholder="特記なし"></textarea>
            `;
            container.appendChild(div);
        });
    }

    // グラフ生成
    function initChart() {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: axesData.map(a => a.name),
                datasets: [
                    { label: '現在', data: axesData.map(a => a.after), backgroundColor: 'rgba(214, 158, 46, 0.4)', borderColor: '#d69e2e', borderWidth: 2, order: 1 },
                    { label: '入会時', data: axesData.map(a => a.before), backgroundColor: 'rgba(113, 128, 150, 0.1)', borderColor: '#718096', borderWidth: 1, borderDash: [5,5], order: 2 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 10, ticks: { display: false } } } }
        });
    }

    // スライダー更新
    function updateData(index, type, value) {
        axesData[index][type] = parseInt(value);
        document.getElementById(`${type}-val-${index}`).textContent = value;
        initChart();
    }

    // QRコード生成
    function generateQR() {
        const url = document.getElementById('videoUrlInput').value.trim();
        const accessArea = document.getElementById('videoAccessArea');
        const qrContainer = document.getElementById('qrcode');
        
        qrContainer.innerHTML = ""; // クリア
        
        if (url) {
            accessArea.style.display = "flex";
            qrCodeInstance = new QRCode(qrContainer, {
                text: url,
                width: 80,
                height: 80,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.L
            });
        } else {
            accessArea.style.display = "none";
        }
    }

    // PDFファイル生成（JSで完全制御）
    function exportToPDF() {
        const container = document.getElementById('report-container');
        const videoUrl = document.getElementById('videoUrlInput').value.trim();
        
        // テキストエリアの内容をHTMLに固定化
        document.querySelectorAll('textarea').forEach(ta => {
            ta.innerHTML = ta.value; 
            if(ta.value.trim() === '') {
                ta.value = "特記なし";
                ta.style.color = "#718096";
            }
        });

        // exportingクラスを付与して不要なUIを隠す
        container.classList.add('exporting');

        // html2canvasで一度高画質な画像(PNG)にする
        html2canvas(container, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
            // 元のUIに戻す
            container.classList.remove('exporting');
            document.querySelectorAll('textarea').forEach(ta => {
                if(ta.value === "特記なし") { ta.value = ""; ta.style.color = "#000000"; }
            });

            const imgData = canvas.toDataURL('image/png');
            
            // jsPDFでPDFを構築
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4'); // A4縦
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            
            // レポート画像をPDFの背景として貼り付け
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);

            // ★極秘テクニック：PDFの上に「見えないタップ領域（リンク）」と案内テキストを被せる★
            if (videoUrl) {
                // PDFの最下部にタップを促すテキストを挿入
                pdf.setTextColor(26, 54, 93); // primary color
                pdf.setFontSize(14);
                // テキスト自体にリンクを付与（スマホのPDFビューワーでタップ可能になる）
                pdf.textWithLink('【ここをタップして解説動画を再生】', pdfWidth / 2, pdfHeight + 15, { url: videoUrl }, { align: 'center' });
            }

            const playerName = document.getElementById('playerName').value.trim() || '選手';
            pdf.save(`IDP_Report_${playerName}.pdf`);
        });
    }

    buildUI();
    initChart();
</script>
</body>
</html>
